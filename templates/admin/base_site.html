{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | TableGO Admin{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/svg+xml" href="{% static 'booking/img/tablego-icon.svg' %}">
<link rel="stylesheet" href="{% static 'booking/admin.css' %}?v=2">
{% endblock %}

{% block branding %}
<h1 id="site-name" class="tablego-brand">
  <a href="{% url 'admin:index' %}">
    {% include "_logo.html" %}
    <span>Table<span class="brand-accent">GO</span><small>ADMIN</small></span>
  </a>
</h1>
{% endblock %}

{% block nav-global %}
<a class="admin-dashboard-link" href="{% url 'dashboard' %}">
  <span aria-hidden="true">&#8592; </span> Dashboard
</a>
{% endblock %}

{% load static %}

<div class="cards">
  {% for r in restaurants|slice:":3" %}
    <article class="rcard">
      <div class="ph" role="img" aria-label="{{ r.name }} restaurant" style="background-image:url('{% static 'booking/img/'|add:r.slug|add:'.jpg' %}')"></div>
      <div class="rb">
        <div class="restaurant-details">
          <h3>{{ r.name }}</h3>
          <p class="mu">{{ r.location|default:"Main Branch" }}</p>
          <p class="mu">{{ r.cuisine }}</p>
        </div>
        <a class="rbtn {{ r.slug }}" href="{% url 'restaurant' r.slug %}">Reserve Here <i class="ri-arrow-right-line" aria-hidden="true"></i></a>
      </div>
    </article>
  {% empty %}
    <p class="empty-state">No restaurants are currently available.</p>
  {% endfor %}
</div>
